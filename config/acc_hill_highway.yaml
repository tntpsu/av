# ACC hill_highway overlay — MINIMAL (adopted 2026-10-09, T-ACC-OVERLAY-STACK).
#
# ACC block + the scenario speed caps only. No `_inherits: mpc_hill_highway.yaml`, no lateral
# retune (the archived overlay zeroed pp_feedback_gain and curve feedforward, smoothed steering
# at 0.6, ran accel_tracking off). Archived stack: config/legacy/acc_hill_highway_full_2026-03.yaml.
# A/B 2026-10-09 (3 runs each, production stack): G1 ACC 98-100 %, at-car RMS 0.023-0.030 m,
# post-conv gap RMSE 8.6-9.7 m (gate <= 10) with bias +6.5 m (was +1.8 with accel_tracking off —
# T-ACC-EQ-BIAS, a base routing item); G2 clean stops, TTC min 2.2 s x3 (gate 2.0; was 2.4-2.5).
#
# ACC notes: time_headway 2.0 s (vs 1.5 on flat) compensates reduced braking authority uphill
# (grade FF adds propulsive bias). G2 gate: comfortable_decel 2.5 >= 2 x grade_ff_bias (~0.85 @ 5 %).
#
# Usage:
#   ./start_av_stack.sh --config config/acc_hill_highway.yaml \
#       --track-yaml tracks/scenarios/hill_g1_grade_following.yml --duration 90
control:
  longitudinal:
    max_speed: 14.0
safety:
  max_speed: 14.0
acc:
  enabled: true
  gap_alpha: 0.30
  rate_alpha: 0.20
  target_gap_time_headway_s: 2.0
  min_gap_s0_m: 2.0
  idm_max_accel_mps2: 1.5
  idm_comfortable_decel_mps2: 2.5
  cutout_speed_mps: 3.0
  fallback_frames: 5
  reengage_frames: 3
  disengage_ramp_mps2: 1.5
  detection_range_m: 60.0
