# ACC highway overlay — MINIMAL (2026-10-09 A/B candidate, T-ACC-OVERLAY-STACK)
#
# Only what an ACC scenario needs on top of the production stack: the ACC block and the
# scenario speed limits. No `_inherits: mpc_highway.yaml`, no lateral / trajectory /
# distractor-guard / sync-packet / safety-gate overrides — those were March-2026 workarounds
# (see acc_highway.yaml comments) and G1 showed an inherited MPC key alone could destabilise
# the lateral loop. The scenario should test the controller the sweep tests.
trajectory:
  target_speed: 15.0
  mpc:
    mpc_v_max: 17.0
control:
  longitudinal:
    max_speed: 17.0
safety:
  max_speed: 17.0
acc:
  enabled: true
  gap_alpha: 0.30
  rate_alpha: 0.20
  target_gap_time_headway_s: 2.5
  min_gap_s0_m: 2.0
  idm_max_accel_mps2: 2.0
  idm_comfortable_decel_mps2: 2.5
  cutout_speed_mps: 0.05
  fallback_frames: 5
  reengage_frames: 3
  disengage_ramp_mps2: 2.0
  detection_range_m: 150.0
