# ACC autobahn overlay — MINIMAL (adopted 2026-10-09, T-ACC-OVERLAY-STACK).
#
# ACC block + the scenario's SPEED PREMISE only. No `_inherits: mpc_autobahn.yaml`, no NMPC/LMPC
# retune, no curve-intent / distractor / regime-hysteresis overrides. Archived stack:
# config/legacy/acc_autobahn_full_2026-03.yaml (its NMPC retune was never exercised: A1/A2 follow
# a 12 m/s lead at a median 11.6 m/s in the LMPC regime 98-99 % of the time).
# A/B 2026-10-09 (3 runs each, production stack): A1 ACC 100 %, post-conv gap RMSE 3.1-3.8 m
# (gate <= 10), at-car RMS 0.063 m; A2 TTC min 14.2-14.5 s, steering step 0.011-0.013 (gate 0.10),
# jerk p95 2.6-3.1 m/s^3, 0 collisions.
#
# Speed premise (declared, not a workaround): A1/A2 ask for a 25 m/s free-flow target on
# autobahn_30. The base perception-horizon guardrail holds the stack to ~15 m/s — the scenario
# explicitly runs beyond the perception ODD, so the guardrail is off HERE and nowhere else.
#
# Usage:
#   ./start_av_stack.sh --config config/acc_autobahn.yaml \
#       --track-yaml tracks/scenarios/autobahn_a1_steady.yml --duration 120
trajectory:
  target_speed: 25.0
  mpc:
    mpc_v_max: 30.0
  speed_governor:
    speed_horizon_guardrail_enabled: false
control:
  longitudinal:
    max_speed: 30.0
safety:
  max_speed: 28.0
acc:
  enabled: true
  gap_alpha: 0.30
  rate_alpha: 0.20
  target_gap_time_headway_s: 1.5
  min_gap_s0_m: 2.0
  idm_max_accel_mps2: 2.0
  idm_comfortable_decel_mps2: 2.5
  cutout_speed_mps: 5.0
  fallback_frames: 5
  reengage_frames: 3
  disengage_ramp_mps2: 2.0
  detection_range_m: 60.0
