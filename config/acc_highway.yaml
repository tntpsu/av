# ACC highway overlay — MINIMAL (adopted 2026-10-09, T-ACC-OVERLAY-STACK).
#
# Only what an ACC scenario needs on top of the production stack: the ACC block and the
# scenario speed limits. No `_inherits: mpc_highway.yaml`, no lateral / trajectory /
# distractor-guard / sync-packet / safety-gate overrides. The 149-key stack this replaced
# (March-2026 workarounds) is archived at config/legacy/acc_highway_full_2026-03.yaml; it cost
# 0.25-0.30 m of at-car lateral RMS on highway_65 and masked a base launch defect
# (T-LAUNCH-CURVATURE-SEED, fixed in the base the same day). A/B 2026-10-09: H2 gap RMSE 19 m /
# converges 15 s (full overlay 21 m / 13 s), H8 engage edges 23 -> 1, lateral 0.39 -> 0.09 m.
#
# Usage:
#   ./start_av_stack.sh --config config/acc_highway.yaml \
#       --track-yaml tracks/scenarios/highway_h2_steady.yml --duration 90
trajectory:
  target_speed: 15.0
  mpc:
    mpc_v_max: 17.0
control:
  longitudinal:
    max_speed: 17.0
safety:
  max_speed: 17.0
acc:
  enabled: true
  gap_alpha: 0.30
  rate_alpha: 0.20
  target_gap_time_headway_s: 2.5
  min_gap_s0_m: 2.0
  idm_max_accel_mps2: 2.0
  idm_comfortable_decel_mps2: 2.5
  cutout_speed_mps: 0.05
  fallback_frames: 5
  reengage_frames: 3
  disengage_ramp_mps2: 2.0
  detection_range_m: 150.0
